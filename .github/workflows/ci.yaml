name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet e2e tests
        run: go vet -tags e2e ./...

      - name: Run tests
        run: make test

  e2e:
    name: E2E (dry run)
    runs-on: ubuntu-latest
    # The provider runs in dry-run mode, so these tests only read from
    # DNScaster. They still need an API key, which pull requests from forks
    # do not get, so the step is skipped there.
    env:
      DNSCASTER_API_KEY: ${{ secrets.DNSCASTER_API_KEY }}
      DNSCASTER_OWNER_ID: kind-test
      DNSCASTER_NAMESERVER_SET_ID: nst_0wd1fQSt2uYYNP4j3YLCZX
      DNSCASTER_E2E_ZONE: dnstest.pinax.network
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run e2e tests
        if: env.DNSCASTER_API_KEY != ''
        run: make e2e

  docker:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          make docker-build \
            IMAGE_NAME=${{ steps.image.outputs.name }} \
            VERSION=${{ github.ref_name }} \
            IMAGE_TAGS="${{ github.ref_name }} latest"

      - name: Push image
        run: |
          make docker-push \
            IMAGE_NAME=${{ steps.image.outputs.name }} \
            IMAGE_TAGS="${{ github.ref_name }} latest"

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release TAG=${{ github.ref_name }}
