# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: example-a-record
spec:
  endpoints:
    - dnsName: crds.dnstest.pinax.network
      recordType: A
      targets:
        - 1.1.1.1
        - 1.0.0.1
      providerSpecific:
        - name: webhook/dnscaster-ip-monitor-uri
          value: ping
    - dnsName: crds.dnstest.pinax.network
      recordType: AAAA
      targets:
        - 2606:4700:4700::1111
      providerSpecific:
        - name: webhook/dnscaster-ip-monitor-uri
          value: ping
