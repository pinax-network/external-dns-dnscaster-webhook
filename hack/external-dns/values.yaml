---
fullnameOverride: external-dns-dnscaster

# Chart 1.22.0 still defaults to appVersion 0.22.0.
image:
  tag: v0.23.0

logLevel: debug
logFormat: text

interval: 5s
sources:
  - gateway-httproute
  - ingress
  - service
  - crd
registry: crd
txtOwnerId: external-dns
# The crd registry stores DNSRecord objects in this namespace. It defaults to the
# namespace external-dns runs in, but v0.23.0 made it independent of the source
# namespace, so set it explicitly.
extraArgs:
  crd-registry-namespace: kube-system
  enable-legacy-annotation-prefix: true
domainFilters: ["dnstest.pinax.network"]
excludeDomains: []
policy: sync

provider:
  name: webhook
  webhook:
    image:
      repository: localhost:5001/external-dns-dnscaster
      tag: latest
      pullPolicy: Always
    env:
      - name: LOG_FORMAT
        value: text
      - name: LOG_LEVEL
        value: debug
      - name: DOMAIN_FILTER
        value: "dnstest.pinax.network"

      - name: DNSCASTER_NAMESERVER_SET_ID
        value: nst_0wd1fQSt2uYYNP4j3YLCZX
      - name: DNSCASTER_OWNER_ID
        value: kind-test
      - name: DNSCASTER_API_KEY
        valueFrom:
          secretKeyRef:
            name: dnscaster-api-key
            key: API_KEY

serviceMonitor:
  enabled: true
